<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>__MSG_extName__</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup">
    <div class="header">
      <img src="icons/icon48.png" alt="Extension icon" class="logo" />
      <div>
        <h1>__MSG_extName__</h1>
        <p class="sub">__MSG_extTitle__</p>
      </div>
    </div>

    <section class="card accent">
      <label class="row master-row" for="enabled">
        <div>
          <div class="label">__MSG_masterSwitch__</div>
          <div class="help">__MSG_masterSwitchHelp__</div>
        </div>
        <span class="switch">
          <input id="enabled" type="checkbox" />
          <span class="slider"></span>
        </span>
      </label>
    </section>

    <section class="card">
      <div class="section-title">__MSG_segmentControls__</div>

      <label class="row" for="skipRecaps">
        <div>
          <div class="label">__MSG_recaps__</div>
          <div class="help">__MSG_recapsHelp__</div>
        </div>
        <span class="switch">
          <input id="skipRecaps" type="checkbox" />
          <span class="slider"></span>
        </span>
      </label>

      <label class="row" for="skipIntros">
        <div>
          <div class="label">__MSG_intros__</div>
          <div class="help">__MSG_introsHelp__</div>
        </div>
        <span class="switch">
          <input id="skipIntros" type="checkbox" />
          <span class="slider"></span>
        </span>
      </label>

      <label class="row" for="skipOutros">
        <div>
          <div class="label">__MSG_outros__</div>
          <div class="help">__MSG_outrosHelp__</div>
        </div>
        <span class="switch">
          <input id="skipOutros" type="checkbox" />
          <span class="slider"></span>
        </span>
      </label>

      <label class="row" for="skipPreviews">
        <div>
          <div class="label">__MSG_previews__</div>
          <div class="help">__MSG_previewsHelp__</div>
        </div>
        <span class="switch">
          <input id="skipPreviews" type="checkbox" />
          <span class="slider"></span>
        </span>
      </label>
    </section>

    <section class="card">
      <div class="section-title collapsible-header" id="advancedToggle">
        __MSG_advanced__
        <span class="toggle-icon">▼</span>
      </div>
      
      <div id="advancedContent" class="collapsible-content collapsed">

        <label class="stacked" for="language">
          <div class="label">__MSG_language__</div>
          <div class="help">__MSG_languageHelp__</div>
          <select id="language">
            <option value="en">English</option>
            <option value="de">Deutsch</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
          </select>
        </label>

        <label class="stacked" for="skipDelay">
          <div class="label">__MSG_skipDelay__</div>
          <div class="help">__MSG_skipDelayHelp__</div>
          <div class="input-row">
            <input id="skipDelay" type="range" min="0" max="10" step="1" />
            <span id="skipDelayValue">3</span>
            <span class="suffix">__MSG_seconds__</span>
          </div>
        </label>

        <div class="info-box">
          <div class="label">__MSG_keyboardShortcut__</div>
          <div class="help">__MSG_keyboardShortcutHelp__</div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <a id="githubLink" data-url="https://github.com/mischiminator/Chrunchroll-auto-skip">Github</a>
    </footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
